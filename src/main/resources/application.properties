# Load an optional local .env (KEY=VALUE) file for development. The file is
# git-ignored; production deployments should inject real environment variables.
spring.config.import=optional:file:.env[.properties]

# Server
server.port=8088
server.servlet.context-path=/sondhan
application.version=1.0.0
app.retry.max.attempts=3
# Never leak exception messages or stack traces to API clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# PostgreSQL DB Settings (credentials MUST come from the environment)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_db}
spring.datasource.username=${DB_USERNAME:bduser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:/db/migration
# TODO: enable once all environments have been baselined.
spring.flyway.validate-on-migrate=false

# Mail Server (credentials MUST come from the environment)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Blood Donation Properties
min.days.between.donation=90

# KafkaConfiguration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bd.blooddonorfinder.payload.request.DonorSearchRequest
spring.kafka.consumer.group-id=notification-consumer-group

kafka.event.source=blood-donor-service

# Kafka Producer Configuration
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
kafka.producer.max-publish-retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.compression-type=snappy
spring.kafka.producer.properties.max.in.flight.requests.per.connection=3

# Kafka Consumer Configuration
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.concurrency=3
spring.kafka.consumer.max-retries=3
spring.kafka.consumer.retry-interval-ms=1000
spring.kafka.consumer.poll.timeout=3000

# Application-specific Kafka settings
kafka.topics.eligible-donors=blood-donor-notifications
kafka.consumer.group-id=sondhan-consumer-group

# Kafka-Topic-Version
kafka.topic.version=V2

# Kafka_Topics
kafka.topic.name=blood-donor-notification

# ElasticSearch Configuration
elasticsearch.host=${ELASTICSEARCH_HOST:localhost}
elasticsearch.port=${ELASTICSEARCH_PORT:9200}
elasticsearch.scheme=${ELASTICSEARCH_SCHEME:http}

# Elastic-Index
elastic.bdf.donor.search.index=donor_search_index
elastic.bdf.donor.reg.index=registered_donors_index
elasticsearch.index.name.registered.users=registered_donors

# Geo
geo.fetch.lat.long.url=https://nominatim.openstreetmap.org/search?format=json&q=
default.geo.search.radius=30
geo.enrichment.poll-interval=10m

# Security
# Access/refresh token lifetimes are in seconds.
security.jwt.access.token.validity=${JWT_ACCESS_TOKEN_VALIDITY:1200}
security.jwt.refresh.token.validity=${JWT_REFRESH_TOKEN_VALIDITY:604800}
security.jwt.issuer=${JWT_ISSUER:sondhan}
# RSA signing keys are loaded from files outside the source tree. When both
# paths are empty a temporary key pair is generated (development only).
rsa.private.key.path=${RSA_PRIVATE_KEY_PATH:}
rsa.public.key.path=${RSA_PUBLIC_KEY_PATH:}
# Failure budget for authentication endpoints. Login counters are scoped by
# client IP and resolved user id; OTP counters additionally include the purpose.
security.auth.failure.max-attempts=${AUTH_FAILURE_MAX_ATTEMPTS:10}
security.auth.failure.window-minutes=${AUTH_FAILURE_WINDOW_MINUTES:5}

# PII tokenization and OTP hashing keys (MUST come from the environment)
sondhan.pii.encryption-key=${PII_ENCRYPTION_KEY}
sondhan.pii.hash-key=${PII_HASH_KEY}
sondhan.otp.hash-key=${OTP_HASH_KEY}

# Async
sondhan.async.core.pool.size=4
sondhan.async.max.pool.size=8
sondhan.async.queue.capacity=500
sondhan.async.keep.alive.seconds=60

# Redis
spring.data.redis.cluster.nodes=${REDIS_CLUSTER_NODES:127.0.0.1:6379,127.0.0.1:6381,127.0.0.1:6383}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# Actuator: expose health only, never env/configprops/heapdump.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# OpenAPI/Swagger: disable in production with SPRINGDOC_ENABLED=false
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# App
app.redis.search.rate.limit.per.minute=30
app.search.max.raw.results=50
app.email.from=${MAIL_USERNAME}
app.org.name=Team Sondhan
