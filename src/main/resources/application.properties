# Load an optional local .env (KEY=VALUE) file for development. The file is
# git-ignored; production deployments should inject real environment variables.
spring.config.import=optional:file:.env[.properties]

# Server
server.port=8088
server.servlet.context-path=/sondhan
# Let in-flight requests finish before the container is stopped. The timeout
# is kept below the orchestrator/container stop grace period.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
application.version=1.0.0
app.retry.max.attempts=3
# Never leak exception messages or stack traces to API clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# PostgreSQL DB Settings (credentials MUST come from the environment)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bd_db}
spring.datasource.username=${DB_USERNAME:bduser}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:/db/migration
# TODO: enable once all environments have been baselined.
spring.flyway.validate-on-migrate=false

# Mail Server (credentials MUST come from the environment)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Blood Donation Properties
min.days.between.donation=90

# KafkaConfiguration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bd.blooddonorfinder.payload.request.DonorSearchRequest
spring.kafka.consumer.group-id=notification-consumer-group

kafka.event.source=blood-donor-service

# Kafka Producer Configuration
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
kafka.producer.max-publish-retries=3
# How long the outbox relay waits for a broker acknowledgement before treating
# the publication as failed and scheduling a retry.
kafka.producer.publish-timeout-ms=10000
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.compression-type=snappy
spring.kafka.producer.properties.max.in.flight.requests.per.connection=3

# Kafka Consumer Configuration
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.concurrency=3
spring.kafka.consumer.max-retries=3
spring.kafka.consumer.retry-interval-ms=1000
spring.kafka.consumer.poll.timeout=3000

# Application-specific Kafka settings
kafka.topics.eligible-donors=blood-donor-notifications
kafka.consumer.group-id=sondhan-consumer-group

# Email notification pipeline (transactional outbox)
kafka.topics.email-notification=email.notification
# Dedicated group so email retries/rebalances never disturb indexing consumers.
kafka.consumer.email.group-id=email-notification-consumer-group
email.outbox.consumer.concurrency=1
email.outbox.relay.poll-interval=5s
email.outbox.relay.batch-size=25
email.outbox.relay.max-attempts=10
email.outbox.relay.initial-backoff=5s
email.outbox.relay.max-backoff=5m
email.outbox.relay.stale-claim-timeout=5m
email.outbox.retention=7d
email.outbox.cleanup.cron=0 30 2 * * *
# Key used to encrypt email payloads at rest and in Kafka. Falls back to the
# PII key (with domain separation) for existing deployments.
sondhan.email.payload-key=${EMAIL_PAYLOAD_KEY:${PII_ENCRYPTION_KEY}}

# Kafka-Topic-Version
kafka.topic.version=V2

# Kafka_Topics
kafka.topic.name=blood-donor-notification

# ElasticSearch Configuration
elasticsearch.host=${ELASTICSEARCH_HOST:localhost}
elasticsearch.port=${ELASTICSEARCH_PORT:9200}
elasticsearch.scheme=${ELASTICSEARCH_SCHEME:http}

# Elastic-Index
elastic.bdf.donor.search.index=donor_search_index
elastic.bdf.donor.reg.index=registered_donors_index
elasticsearch.index.name.registered.users=registered_donors

# Geo
geo.fetch.lat.long.url=https://nominatim.openstreetmap.org/search?format=json&q=
default.geo.search.radius=30
geo.enrichment.poll-interval=10m
# Index used by nearby donor geo search (location must be mapped as geo_point).
elastic.bdf.donor.geo.index=registered_donors

# Location freshness pipeline
# Nearby searches exclude donors whose coordinates are older than this window.
app.search.max-location-age-days=90
# Device location updates: per-user throttle + movement dedupe.
app.location.update.min-interval-seconds=60
app.location.dedupe.radius-meters=100
app.location.dedupe.window-hours=24
# Nightly sweep that asks donors with stale coordinates to reconfirm.
geo.staleness.cron=0 0 3 * * *
geo.staleness.batch-size=50
geo.staleness.max-per-run=500
geo.staleness.reconfirm-cooldown-days=7
app.location-reconfirm.url=https://sondhan.app/location/confirm

# Realtime chat (request -> accept -> chat)
# WebSocket is push-only; sends persist via REST /api/chat/**.
app.chat.send.rate-limit-per-minute=30
app.chat.presence.ttl-seconds=300
app.url=https://sondhan.app

# Mobile push (FCM). Disabled unless credentials are mounted; pushes are best-effort.
app.push.enabled=${PUSH_ENABLED:false}
app.push.credentials-path=${FCM_CREDENTIALS_PATH:}

# Notification center: every event creates a row + realtime push; email is daily digest only.
app.notification.digest.cron=0 0 9 * * *
app.notification.digest.min-age-hours=24
app.notification.digest.cooldown-hours=24
app.notification.digest.batch-size=100
app.notification.digest.max-per-run=2000
app.notification.digest.items-per-email=10

# Donation completion flow
app.donation.auto-approve-days=3
app.donation.auto-approve.cron=0 0 * * * *
app.donation.auto-approve.max-per-run=500
app.donation.future-tolerance-seconds=300

# Blood request lifecycle: urgency sets the auto-expiry TTL, and unanswered
# urgent/critical requests are re-broadcast on a widening radius ladder.
app.request.ttl-hours.routine=72
app.request.ttl-hours.urgent=24
app.request.ttl-hours.critical=6
app.escalation.radii-km=10,25,50,80
app.escalation.interval-minutes.urgent=60
app.escalation.interval-minutes.critical=15
app.escalation.max-donors-per-escalation=50
app.escalation.batch-size=50

# Document service (MinIO, S3-compatible)
app.storage.minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
app.storage.minio.access-key=${MINIO_ACCESS_KEY:sondhan-admin}
app.storage.minio.secret-key=${MINIO_SECRET_KEY:sondhan-secret}
app.storage.presign-ttl-seconds=${MINIO_PRESIGN_TTL:300}
app.storage.ensure-buckets=true
app.storage.document.max-photo-bytes=5242880
app.storage.document.max-report-bytes=20971520
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.file-size-threshold=2MB

# Security
# Access/refresh token lifetimes are in seconds.
security.jwt.access.token.validity=${JWT_ACCESS_TOKEN_VALIDITY:1200}
security.jwt.refresh.token.validity=${JWT_REFRESH_TOKEN_VALIDITY:604800}
security.jwt.issuer=${JWT_ISSUER:sondhan}
# RSA signing keys are loaded from files outside the source tree. When both
# paths are empty a temporary key pair is generated (development only).
rsa.private.key.path=${RSA_PRIVATE_KEY_PATH:}
rsa.public.key.path=${RSA_PUBLIC_KEY_PATH:}
# Failure budget for authentication endpoints. Login counters are scoped by
# client IP and resolved user id; OTP counters additionally include the purpose.
security.auth.failure.max-attempts=${AUTH_FAILURE_MAX_ATTEMPTS:10}
security.auth.failure.window-minutes=${AUTH_FAILURE_WINDOW_MINUTES:5}

# PII tokenization and OTP hashing keys (MUST come from the environment)
sondhan.pii.encryption-key=${PII_ENCRYPTION_KEY}
sondhan.pii.hash-key=${PII_HASH_KEY}
sondhan.otp.hash-key=${OTP_HASH_KEY}

# Security hardening
# Expose Swagger/OpenAPI only in development; production should set false.
app.security.api-docs.public=${API_DOCS_PUBLIC:true}
# Redis-backed per-IP rate limits.
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.auth-per-minute=30
app.security.rate-limit.search-per-minute=60
# Return a generic "OTP sent" response for duplicate registrations so attackers
# cannot probe which accounts exist.
app.security.anti-enumeration.enabled=${ANTI_ENUMERATION_ENABLED:true}

# Async
sondhan.async.core.pool.size=4
sondhan.async.max.pool.size=8
sondhan.async.queue.capacity=500
sondhan.async.keep.alive.seconds=60

# Redis
spring.data.redis.cluster.nodes=${REDIS_CLUSTER_NODES:127.0.0.1:6379,127.0.0.1:6381,127.0.0.1:6383}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# Actuator: expose health only, never env/configprops/heapdump.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
# Liveness/readiness groups used by container health checks and orchestrators.
# Liveness intentionally excludes external dependencies (DB/Kafka/Redis/ES).
management.endpoint.health.probes.enabled=true

# OpenAPI/Swagger: disable in production with SPRINGDOC_ENABLED=false
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# App
app.redis.search.rate.limit.per.minute=30
app.search.max.raw.results=50
app.email.from=${MAIL_USERNAME}
app.org.name=Team Sondhan
