# Prod profile — activated by the production compose stack
# (SPRING_PROFILES_ACTIVE=prod, see Docker/docker-compose.prod.yml).
#
# Defense in depth: the fixed dev OTP must never be set here. The base
# configuration has no default for this key; this explicit empty value
# guarantees the dev backdoor is off even if a dev value leaks into the
# environment.
sondhan.otp.dev-fixed-code=
